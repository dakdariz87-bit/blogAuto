name: Windows launcher verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install original dependencies without automatic install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Launcher and real process timeout tests
        run: node --test launcher.test.cjs electron-setup.test.cjs setup-supervisor.test.cjs extract-stream.test.cjs codex-connection.test.cjs task-result.test.cjs
      - name: Browser onboarding interactions without live accounts
        run: node verify-onboarding-ui.cjs
      - name: Install Codex CLI for metadata protocol verification
        run: npm install --prefix "$env:RUNNER_TEMP/blogauto-codex-test" --ignore-scripts --no-audit --no-fund @openai/codex
      - name: Check real Codex protocol without login or inference
        run: node verify-codex-protocol.cjs "$env:RUNNER_TEMP/blogauto-codex-test/node_modules/.bin/codex.cmd"
      - name: Original source checks
        run: npm run check
      - name: Download verified Electron and open original app on Windows
        run: node verify-windows-launcher.cjs
      - name: Create verified Windows bundle
        run: node make-windows-bundle.cjs
      - name: Open the bundled app without Electron installation
        run: node "$env:RUNNER_TEMP/blogAuto-v0.2.2-Windows-ready/verify-windows-launcher.cjs"
      - uses: actions/upload-artifact@v4
        with:
          name: blogAuto-v0.2.2-Windows-ready
          path: ${{ runner.temp }}/blogAuto-v0.2.2-Windows-ready/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-v0.2.2-verification
          path: verification-output/
